<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Топливный кризис — Таймлапс</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#0f1117; color:#e0e0e0; padding:20px; }
h1 { color:#fff; font-size:28px; margin-bottom:4px; }
h2 { color:#8ab4f8; font-size:22px; margin:30px 0 15px; border-bottom:1px solid #333; padding-bottom:8px; }
.subtitle { color:#999; font-size:14px; margin-bottom:20px; }
.controls { display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap; }
.controls select, .controls button { background:#1a1d29; color:#e0e0e0; border:1px solid #333; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
.controls select:hover, .controls button:hover { border-color:#8ab4f8; }
.chart-box { background:#1a1d29; border-radius:12px; padding:20px; margin-bottom:20px; border:1px solid #2a2d3a; position:relative; height:400px; }
.chart-box.tall { height:500px; }
.summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:20px; }
.card { background:#1a1d29; border-radius:12px; padding:16px; text-align:center; border:1px solid #2a2d3a; }
.card .value { font-size:28px; font-weight:700; color:#fff; }
.card .label { font-size:12px; color:#888; margin-top:4px; }
.card.green .value { color:#27ae60; }
.card.red .value { color:#e74c3c; }
.card.orange .value { color:#f39c12; }
.card.blue .value { color:#3498db; }
table { width:100%; border-collapse:collapse; font-size:14px; margin-bottom:20px; }
th { background:#1a1d29; padding:10px 12px; text-align:left; color:#8ab4f8; font-weight:600; border-bottom:2px solid #333; position:sticky; top:0; }
td { padding:8px 12px; border-bottom:1px solid #222; }
tr:hover { background:#1a1d29; }
.num { text-align:right; font-variant-numeric:tabular-nums; }
.badge { padding:3px 8px; border-radius:6px; color:#fff; font-weight:600; font-size:13px; }
.badge.red { background:#e74c3c; }
.badge.orange { background:#f39c12; }
.badge.green { background:#27ae60; }
.delta-pos { color:#27ae60; font-weight:600; }
.delta-neg { color:#e74c3c; font-weight:600; }
.tabs { display:flex; gap:4px; margin-bottom:15px; flex-wrap:wrap; }
.tab { padding:8px 16px; background:#1a1d29; border:1px solid #333; border-radius:8px 8px 0 0; cursor:pointer; font-size:14px; color:#888; }
.tab.active { background:#0f1117; border-bottom:2px solid #8ab4f8; color:#8ab4f8; }
.hidden { display:none; }
.loading { text-align:center; padding:40px; color:#888; }
.toggle { display:inline-flex; align-items:center; gap:8px; margin-left:12px; }
.toggle input { display:none; }
.toggle .slider { width:40px; height:22px; background:#333; border-radius:11px; position:relative; cursor:pointer; transition:background 0.2s; }
.toggle .slider:after { content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; background:#888; border-radius:50%; transition:0.2s; }
.toggle input:checked + .slider { background:#2c5f8f; }
.toggle input:checked + .slider:after { left:20px; background:#3498db; }
.toggle .label { color:#888; font-size:14px; user-select:none; }

/* Multi-select dropdown */
.multiselect { position:relative; display:inline-block; min-width:180px; }
.ms-btn { background:#1a1d29; color:#e0e0e0; border:1px solid #333; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; width:100%; text-align:left; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.ms-btn:hover { border-color:#8ab4f8; }
.ms-btn .ms-count { background:#2c5f8f; color:#fff; border-radius:10px; padding:1px 7px; font-size:12px; }
.ms-panel { display:none; position:absolute; top:100%; left:0; min-width:240px; max-height:320px; overflow-y:auto; background:#1a1d29; border:1px solid #444; border-radius:0 0 8px 8px; z-index:1000; padding:4px 0; }
.ms-panel.show { display:block; }
.ms-item { display:flex; align-items:center; gap:8px; padding:6px 12px; cursor:pointer; font-size:14px; color:#ccc; }
.ms-item:hover { background:#222; }
.ms-item input { accent-color:#3498db; }
.ms-item.selected { color:#8ab4f8; }
.ms-divider { border-top:1px solid #333; margin:4px 0; }

/* Mobile responsive */
@media (max-width: 768px) {
  body { padding:10px; }
  h1 { font-size:20px; }
  h2 { font-size:17px; margin:20px 0 10px; }
  .subtitle { font-size:12px; margin-bottom:12px; }
  .controls { flex-direction:column; gap:8px; }
  .controls select, .ms-btn { width:100%; padding:10px 12px; font-size:15px; }
  .multiselect { width:100%; }
  .ms-panel { max-height:240px; }
  .toggle { margin-left:0; align-self:flex-start; }
  .chart-box { padding:10px; height:300px; }
  .chart-box.tall { height:350px; }
  .summary { grid-template-columns:repeat(2,1fr); gap:8px; }
  .card { padding:10px; }
  .card .value { font-size:20px; }
  .card .label { font-size:10px; }
  table { font-size:12px; }
  th, td { padding:6px 8px; }
  th { font-size:11px; }
  .badge { font-size:11px; padding:2px 6px; }
  /* Horizontal scroll for table */
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
}

@media (max-width: 480px) {
  h1 { font-size:18px; }
  h2 { font-size:15px; }
  .summary { grid-template-columns:repeat(2,1fr); }
  .chart-box { height:260px; }
  .chart-box.tall { height:300px; }
  .card .value { font-size:18px; }
  table { font-size:11px; }
  th, td { padding:4px 6px; }
}
</style>
</head>
<body>

<h1>Топливный кризис — Таймлапс</h1>
<p class="subtitle" id="period">Загрузка...</p>

<div class="summary" id="summary"></div>

<h2>Динамика по дням (Вся РФ / ФО / Субъект / Город)</h2>
<div class="controls">
  <div class="multiselect" id="foMs">
    <button class="ms-btn" onclick="toggleMsPanel('foMs')"><span id="foMsLabel">Вся РФ</span><span class="ms-count" id="foMsCount" style="display:none">0</span></button>
    <div class="ms-panel" id="foMsPanel"></div>
  </div>
  <div class="multiselect" id="subjMs">
    <button class="ms-btn" onclick="toggleMsPanel('subjMs')"><span id="subjMsLabel">Все субъекты</span><span class="ms-count" id="subjMsCount" style="display:none">0</span></button>
    <div class="ms-panel" id="subjMsPanel"></div>
  </div>
  <div class="multiselect" id="cityMs">
    <button class="ms-btn" onclick="toggleMsPanel('cityMs')"><span id="cityMsLabel">Все города</span><span class="ms-count" id="cityMsCount" style="display:none">0</span></button>
    <div class="ms-panel" id="cityMsPanel"></div>
  </div>
  <label class="toggle"><input type="checkbox" id="showPrices"><span class="slider"></span><span class="label">Цены</span></label>
  <label class="toggle"><input type="checkbox" id="dtAsNoFuel"><span class="slider"></span><span class="label">Только ДТ = нет</span></label>
  <button id="resetBtn" style="background:#1a1d29; color:#e0e0e0; border:1px solid #333; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer;">Сбросить</button>
</div>
<div class="chart-box tall"><canvas id="cityDailyChart"></canvas></div>

<h2>Области — было / стало</h2>
<div class="chart-box tall"><canvas id="regionBeforeAfterChart"></canvas></div>

<h2>Проблемные города — топ-30 (худшие сейчас)</h2>
<div class="table-wrap">
<table id="problemTable">
<tr><th>Город</th><th>Регион</th><th class="num">Было (%)</th><th class="num">Стало (%)</th><th class="num">Изменение</th><th class="num">Снимков (было)</th><th class="num">Снимков (стало)</th></tr>
</table>
</div>

<script>
let DATA = null;
let dtAsNoFuel = false;

function adjustSeries(series) {
  if (!dtAsNoFuel) return series;
  return series.map(function(s) {
    var adjYes = s.yes - (s.dt_only || 0);
    var adjNo = s.no + (s.dt_only || 0);
    var adjPct = s.total > 0 ? Math.round(adjYes * 100.0 / s.total * 10) / 10 : 0;
    return {date: s.date, total: s.total, yes: adjYes, no: adjNo, queue: s.queue, low: s.low, dt_only: s.dt_only, pct: adjPct};
  });
}

function updateSummary() {
  var rs = adjustSeries(DATA.russia_series);
  var firstPct = rs[0]?.pct || 0;
  var lastPct = rs[rs.length-1]?.pct || 0;
  var minPct = Math.min(...rs.map(r => r.pct));
  var maxPct = Math.max(...rs.map(r => r.pct));
  var avgPct = (rs.reduce((a,r) => a+r.pct, 0) / rs.length).toFixed(1);
  document.getElementById('summary').innerHTML =
    '<div class="card blue"><div class="value">' + firstPct + '%</div><div class="label">Было (первый день)</div></div>' +
    '<div class="card ' + (lastPct<40?'red':lastPct<60?'orange':'green') + '"><div class="value">' + lastPct + '%</div><div class="label">Стало (последний день)</div></div>' +
    '<div class="card red"><div class="value">' + minPct + '%</div><div class="label">Минимум за период</div></div>' +
    '<div class="card green"><div class="value">' + maxPct + '%</div><div class="label">Максимум за период</div></div>' +
    '<div class="card orange"><div class="value">' + avgPct + '%</div><div class="label">Среднее за период</div></div>';
}

async function loadData() {
  try {
    const resp = await fetch('presentation_data.json?v=' + Date.now());
    if (resp.status !== 200) throw new Error('HTTP ' + resp.status);
    DATA = await resp.json();
    init();
  } catch(e) {
    document.getElementById('period').textContent = 'Ошибка загрузки данных: ' + e.message;
  }
}

function pctColor(pct) {
  if (pct < 40) return '#e74c3c';
  if (pct < 60) return '#f39c12';
  return '#27ae60';
}

function init() {
  const p = DATA.period;
  document.getElementById('period').textContent = `Период: ${p.start} → ${p.end} · "Было": ${p.start} – ${p.first_week_end} · "Стало": ${p.last_week_start} – ${p.end}`;

  // Summary cards
  const rs = DATA.russia_series;
  const firstPct = rs[0]?.pct || 0;
  const lastPct = rs[rs.length-1]?.pct || 0;
  const minPct = Math.min(...rs.map(r => r.pct));
  const maxPct = Math.max(...rs.map(r => r.pct));
  const avgPct = (rs.reduce((a,r) => a+r.pct, 0) / rs.length).toFixed(1);

  document.getElementById('summary').innerHTML = `
    <div class="card blue"><div class="value">${firstPct}%</div><div class="label">Было (первый день)</div></div>
    <div class="card ${lastPct<40?'red':lastPct<60?'orange':'green'}"><div class="value">${lastPct}%</div><div class="label">Стало (последний день)</div></div>
    <div class="card red"><div class="value">${minPct}%</div><div class="label">Минимум за период</div></div>
    <div class="card green"><div class="value">${maxPct}%</div><div class="label">Максимум за период</div></div>
    <div class="card orange"><div class="value">${avgPct}%</div><div class="label">Среднее за период</div></div>
  `;

  // Region before/after chart
  const rba = DATA.region_before_after;
  const rbaCtx = document.getElementById('regionBeforeAfterChart').getContext('2d');
  new Chart(rbaCtx, {
    type: 'bar',
    data: {
      labels: rba.map(r => r.region),
      datasets: [{
        label: 'Было (%)',
        data: rba.map(r => r.before_pct),
        backgroundColor: rba.map(r => pctColor(r.before_pct)),
      }, {
        label: 'Стало (%)',
        data: rba.map(r => r.after_pct),
        backgroundColor: rba.map(r => pctColor(r.after_pct)),
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#ccc', boxWidth: 12, font: { size: window.innerWidth < 768 ? 10 : 12 } } } },
      scales: {
        x: { ticks: { color: '#888', maxRotation:90, minRotation:45, autoSkip: true, maxTicksLimit: window.innerWidth < 480 ? 15 : 30, font:{size: window.innerWidth < 768 ? 8 : 10} }, grid: { color: '#222' } },
        y: { min:0, max:100, ticks: { color: '#888', callback: function(v) { return v+'%'; }, font: { size: window.innerWidth < 768 ? 9 : 11 } }, grid: { color: '#222' } }
      }
    }
  });

  // Problem cities table
  const tbl = document.getElementById('problemTable');
  DATA.problem_cities.slice(0, 30).forEach(c => {
    const tr = document.createElement('tr');
    const deltaCls = c.delta > 0 ? 'delta-pos' : c.delta < 0 ? 'delta-neg' : '';
    const deltaStr = c.delta > 0 ? `+${c.delta}%` : `${c.delta}%`;
    tr.innerHTML = `<td>${c.city}</td><td>${c.region}</td>
      <td class="num"><span class="badge ${c.before_pct<40?'red':c.before_pct<60?'orange':'green'}">${c.before_pct}%</span></td>
      <td class="num"><span class="badge ${c.after_pct<40?'red':c.after_pct<60?'orange':'green'}">${c.after_pct}%</span></td>
      <td class="num ${deltaCls}">${deltaStr}</td>
      <td class="num">${c.before_total}</td><td class="num">${c.after_total}</td>`;
    tbl.appendChild(tr);
  });

  // Multi-select filters
  const showPricesToggle = document.getElementById('showPrices');
  const dtAsNoFuelToggle = document.getElementById('dtAsNoFuel');
  let cityChart = null;
  var foSelection = new Set();
  var subjSelection = new Set();
  var citySelection = new Set();

  var LINE_COLORS = ['#3498db','#e74c3c','#f39c12','#27ae60','#9b59b6','#1abc9c','#e67e22','#34495e','#f1c40f','#e91e63','#00bcd4','#ff5722','#607d8b','#795548','#cddc39','#009688'];

  function getMsSelection(panelId) {
    var checks = document.querySelectorAll('#' + panelId + ' input[type=checkbox]');
    var sel = [];
    checks.forEach(function(c) { if (c.checked && c.value) sel.push(c.value); });
    return sel;
  }

  function updateMsLabels() {
    var foSel = getMsSelection('foMsPanel');
    var subjSel = getMsSelection('subjMsPanel');
    var citySel = getMsSelection('cityMsPanel');
    foSelection = new Set(foSel);
    subjSelection = new Set(subjSel);
    citySelection = new Set(citySel);
    // Update labels
    document.getElementById('foMsLabel').textContent = foSel.length === 0 ? 'Вся РФ' : (foSel.length === 1 ? foSel[0] : foSel.length + ' выбрано');
    document.getElementById('foMsCount').textContent = foSel.length; document.getElementById('foMsCount').style.display = foSel.length > 0 ? 'inline' : 'none';
    document.getElementById('subjMsLabel').textContent = subjSel.length === 0 ? 'Все субъекты' : (subjSel.length === 1 ? subjSel[0] : subjSel.length + ' выбрано');
    document.getElementById('subjMsCount').textContent = subjSel.length; document.getElementById('subjMsCount').style.display = subjSel.length > 0 ? 'inline' : 'none';
    document.getElementById('cityMsLabel').textContent = citySel.length === 0 ? 'Все города' : (citySel.length === 1 ? citySel[0] : citySel.length + ' выбрано');
    document.getElementById('cityMsCount').textContent = citySel.length; document.getElementById('cityMsCount').style.display = citySel.length > 0 ? 'inline' : 'none';
  }

  function plotChart() {
    updateMsLabels();
    var foSel = Array.from(foSelection);
    var subjSel = Array.from(subjSelection);
    var citySel = Array.from(citySelection);

    // Determine which series to plot
    var seriesList = []; // [{label, series}]
    if (citySel.length > 0) {
      citySel.forEach(function(c) { if (DATA.city_series[c]) seriesList.push({label: c, series: DATA.city_series[c]}); });
    } else if (subjSel.length > 0) {
      subjSel.forEach(function(s) { if (DATA.region_series[s]) seriesList.push({label: s, series: DATA.region_series[s]}); });
    } else if (foSel.length > 0) {
      foSel.forEach(function(f) { if (DATA.fo_series[f]) seriesList.push({label: f, series: DATA.fo_series[f]}); });
    } else {
      seriesList.push({label: 'Вся РФ', series: DATA.russia_series});
    }

    if (seriesList.length === 0) {
      if (cityChart) cityChart.destroy();
      return;
    }

    // Use union of all dates
    var allDates = {};
    seriesList.forEach(function(item) {
      adjustSeries(item.series).forEach(function(s) { allDates[s.date] = true; });
    });
    var seriesDates = Object.keys(allDates).sort();

    // Build datasets
    var datasets = [];
    var multiMode = seriesList.length > 1;
    seriesList.forEach(function(item, idx) {
      var adjSeries = adjustSeries(item.series);
      var pmap = {};
      adjSeries.forEach(function(s) { pmap[s.date] = s.pct; });
      var color = LINE_COLORS[idx % LINE_COLORS.length];
      datasets.push({
        label: item.label + ' — % с топливом',
        data: seriesDates.map(function(d) { return pmap[d] !== undefined ? pmap[d] : null; }),
        borderColor: color,
        backgroundColor: color + '20',
        fill: !multiMode, tension: 0.3, pointRadius: multiMode ? 2 : 3,
        spanGaps: true,
      });
    });

    // Add queue line only in single mode
    if (!multiMode) {
      var adjSeries = adjustSeries(seriesList[0].series);
      var qmap = {};
      adjSeries.forEach(function(s) { qmap[s.date] = s.queue; });
      datasets.push({
        label: 'Очередь (кол-во)',
        data: seriesDates.map(function(d) { return qmap[d] !== undefined ? qmap[d] : null; }),
        borderColor: '#f39c12',
        yAxisID: 'y1',
        fill: false, tension: 0.3, pointRadius: 2,
        spanGaps: true,
      });
    }

    // Price datasets (single mode only)
    if (showPricesToggle.checked && !multiMode) {
      var fuelColors = {'92': '#e74c3c', '95': '#9b59b6', 'ДТ': '#1abc9c', '100': '#e67e22', '98': '#34495e'};
      var priceLevel = null;
      var priceKey = '';
      if (citySel.length === 1 && DATA.price_city_series) { priceLevel = DATA.price_city_series; priceKey = citySel[0]; }
      else if (subjSel.length === 1 && DATA.price_subj_series) { priceLevel = DATA.price_subj_series; priceKey = subjSel[0]; }
      else if (foSel.length === 1 && DATA.price_fo_series) { priceLevel = DATA.price_fo_series; priceKey = foSel[0]; }
      else { priceLevel = DATA.price_series || {}; }
      Object.keys(priceLevel).forEach(function(fuel) {
        var fuelData = priceLevel[fuel];
        var seriesPrices = (priceKey && fuelData[priceKey]) ? fuelData[priceKey] : (priceKey ? null : fuelData);
        if (!seriesPrices) return;
        var pmap = {};
        seriesPrices.forEach(function(p) { pmap[p.date] = p.price; });
        datasets.push({
          label: 'Цена ' + fuel + ' (руб/л)',
          data: seriesDates.map(function(d) { return pmap[d] || null; }),
          borderColor: fuelColors[fuel] || '#888',
          yAxisID: 'y2',
          fill: false, tension: 0.3, pointRadius: 3,
          spanGaps: true,
        });
      });
    }

    if (cityChart) cityChart.destroy();
    var ctx = document.getElementById('cityDailyChart').getContext('2d');
    cityChart = new Chart(ctx, {
      type: 'line',
      data: { labels: seriesDates, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#ccc', boxWidth: 12, font: { size: window.innerWidth < 768 ? 10 : 12 } } } },
        scales: {
          x: { ticks: { color: '#888', maxRotation:45, autoSkip: true, maxTicksLimit: window.innerWidth < 480 ? 5 : 12, font: { size: window.innerWidth < 768 ? 9 : 11 } }, grid: { color: '#222' } },
          y: { min:0, max:100, ticks: { color: '#888', callback: function(v) { return v + '%'; }, font: { size: window.innerWidth < 768 ? 9 : 11 } }, grid: { color: '#222' }, title: { display: window.innerWidth >= 768, text: '% с топливом', color: '#888' } },
          y1: multiMode ? { display: false } : { position: 'right', ticks: { color: '#888', font: { size: window.innerWidth < 768 ? 9 : 11 } }, grid: { drawOnChartArea: false }, title: { display: window.innerWidth >= 768, text: 'Очередь', color: '#888' } },
          y2: (showPricesToggle.checked && !multiMode) ? { position: 'right', ticks: { color: '#e74c3c', callback: function(v) { return v + ' руб'; }, font: { size: window.innerWidth < 768 ? 9 : 11 } }, grid: { drawOnChartArea: false }, title: { display: window.innerWidth >= 768, text: 'Цена (руб/л)', color: '#e74c3c' }, offset: true } : { display: false }
        }
      }
    });
  }

  var hierarchy = DATA.city_hierarchy || {};

  function buildMsPanel(panelId, items, onChange) {
    var panel = document.getElementById(panelId);
    panel.innerHTML = '';
    items.forEach(function(item) {
      var div = document.createElement('div');
      div.className = 'ms-item';
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.value = item;
      cb.addEventListener('change', function() { div.classList.toggle('selected', cb.checked); onChange(); });
      div.appendChild(cb);
      var label = document.createElement('span');
      label.textContent = item;
      div.appendChild(label);
      panel.appendChild(div);
    });
  }

  function populateFoPanel() {
    var foItems = Object.keys(hierarchy).sort();
    buildMsPanel('foMsPanel', foItems, function() { populateSubjPanel(); plotChart(); });
  }

  function populateSubjPanel() {
    var foSel = getMsSelection('foMsPanel');
    var subjItems = [];
    if (foSel.length > 0) {
      foSel.forEach(function(fo) {
        if (hierarchy[fo]) Object.keys(hierarchy[fo]).forEach(function(s) { if (subjItems.indexOf(s) < 0) subjItems.push(s); });
      });
    } else {
      Object.keys(hierarchy).forEach(function(fo) {
        Object.keys(hierarchy[fo]).forEach(function(s) { if (subjItems.indexOf(s) < 0) subjItems.push(s); });
      });
    }
    // Preserve selection
    var prevSel = getMsSelection('subjMsPanel');
    buildMsPanel('subjMsPanel', subjItems.sort(), function() { populateCityPanel(); plotChart(); });
    // Restore checked state
    document.querySelectorAll('#subjMsPanel input[type=checkbox]').forEach(function(cb) {
      if (prevSel.indexOf(cb.value) >= 0) { cb.checked = true; cb.parentElement.classList.add('selected'); }
    });
    populateCityPanel();
  }

  function populateCityPanel() {
    var foSel = getMsSelection('foMsPanel');
    var subjSel = getMsSelection('subjMsPanel');
    var cityItems = [];
    if (subjSel.length > 0) {
      subjSel.forEach(function(subj) {
        Object.keys(hierarchy).forEach(function(fo) {
          if (hierarchy[fo][subj]) hierarchy[fo][subj].forEach(function(c) { if (cityItems.indexOf(c) < 0) cityItems.push(c); });
        });
      });
    } else if (foSel.length > 0) {
      foSel.forEach(function(fo) {
        if (hierarchy[fo]) Object.keys(hierarchy[fo]).forEach(function(subj) {
          hierarchy[fo][subj].forEach(function(c) { if (cityItems.indexOf(c) < 0) cityItems.push(c); });
        });
      });
    } else {
      Object.keys(hierarchy).forEach(function(fo) {
        Object.keys(hierarchy[fo]).forEach(function(subj) {
          hierarchy[fo][subj].forEach(function(c) { if (cityItems.indexOf(c) < 0) cityItems.push(c); });
        });
      });
    }
    var prevSel = getMsSelection('cityMsPanel');
    buildMsPanel('cityMsPanel', cityItems.sort(), function() { plotChart(); });
    document.querySelectorAll('#cityMsPanel input[type=checkbox]').forEach(function(cb) {
      if (prevSel.indexOf(cb.value) >= 0) { cb.checked = true; cb.parentElement.classList.add('selected'); }
    });
  }

  // Close panels on outside click
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.multiselect')) {
      document.querySelectorAll('.ms-panel').forEach(function(p) { p.classList.remove('show'); });
    }
  });

  showPricesToggle.addEventListener('change', function() { plotChart(); });
  dtAsNoFuelToggle.addEventListener('change', function() { dtAsNoFuel = this.checked; plotChart(); updateSummary(); });
  document.getElementById('resetBtn').addEventListener('click', function() {
    document.querySelectorAll('.ms-panel input[type=checkbox]').forEach(function(cb) { cb.checked = false; cb.parentElement.classList.remove('selected'); });
    showPricesToggle.checked = false;
    dtAsNoFuelToggle.checked = false;
    dtAsNoFuel = false;
    populateSubjPanel();
    populateCityPanel();
    plotChart();
    updateSummary();
  });
  populateFoPanel();
  populateSubjPanel();
  populateCityPanel();
  plotChart();
}

function toggleMsPanel(id) {
  var panel = document.getElementById(id + 'Panel');
  var isOpen = panel.classList.contains('show');
  document.querySelectorAll('.ms-panel').forEach(function(p) { p.classList.remove('show'); });
  if (!isOpen) panel.classList.add('show');
}

loadData();
</script>
</body>
</html>
